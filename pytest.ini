[pytest]
testpaths = tests

# The build scripts run pytest with -X warn_default_encoding, so any text read that
# relies on the platform's default encoding is reported: the difference between the
# machine the code is written on (UTF-8) and a Windows PC (cp1252), which stopped a
# Mittens & Pence build. Libraries' own habits are not ours to fix.
filterwarnings =
    ignore::EncodingWarning:ctypes.*
    ignore::EncodingWarning:curl_cffi.*
    ignore::EncodingWarning:keyring.*
