<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiskers</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b6e6e">
</head>
<body>
<div class="boot" id="boot"><div><div class="spinner"></div><div class="muted small">Opening Whiskers</div></div></div>

<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M14.5 27 L16.5 10.5 L27 19.2 Q32 17.6 37 19.2 L47.5 10.5 L49.5 27 Q53.5 34.5 49.8 42.2 Q44.5 52 32 52 Q19.5 52 14.2 42.2 Q10.5 34.5 14.5 27Z" style="fill:var(--accent)"/>
        <circle cx="25" cy="32.5" r="2.7" style="fill:var(--panel)"/>
        <circle cx="39" cy="32.5" r="2.7" style="fill:var(--panel)"/>
        <path d="M29.8 38.6 H34.2 L32 41.4Z" style="fill:var(--panel)"/>
        <g style="stroke:var(--ink-2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M22 40 L3.5 36.5"/><path d="M22 43.2 L3 44"/><path d="M23 46.2 L6 51.5"/>
          <path d="M42 40 L49 38.2 L53.5 40.2 L61 30.5" style="stroke:var(--accent)" stroke-width="2"/>
          <path d="M42 43.2 L61 44"/><path d="M41 46.2 L58 51.5"/>
        </g>
      </svg>
      <div class="brand-name">Whiskers</div>
      <div class="brand-sub">Investment tracker</div>
    </div>
    <nav id="nav" aria-label="Screens"></nav>
    <div class="rail-foot">
      <button class="btn wide" id="refresh-btn" type="button" title="Sync your platforms and fetch the latest prices">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        <span class="lbl">Refresh</span>
      </button>
      <button class="btn ghost wide" id="tour-btn" type="button" title="A one-minute tour of Whiskers">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg>
        <span class="lbl">Tour</span>
      </button>
      <div class="status" id="refresh-status"></div>
      <div class="credit">&copy; Allan Clark</div>
    </div>
  </aside>

  <main class="main">
    <div class="banner fake" id="fake-banner" hidden>Test mode: every price on this screen is invented. Restart without WHISKERS_FAKE_MARKET to see real ones.</div>
    <div class="banner update" id="update-banner" hidden></div>
    <header class="topbar">
      <div>
        <h1 id="title">Overview</h1>
        <p id="subtitle"></p>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" id="hide-btn" type="button" aria-pressed="false" title="Hide amounts (for screen sharing)"></button>
        <button class="btn ghost" id="theme-btn" type="button" title="Light or dark"></button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><h2 id="modal-title"></h2><button class="btn ghost" id="modal-x" type="button" aria-label="Close">Close</button></header>
    <div id="modal-body"></div>
    <div id="modal-foot"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
